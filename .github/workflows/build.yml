name: Build v2rayN (5.39 net48, maintained)

on:
  push:
    branches: [net48-5.39-modern]
  pull_request:
    branches: [net48-5.39-modern]
  schedule:
    # Nightly. 5.39 no longer tracks an upstream source tree, so a periodic run
    # is the only thing that notices when a dependency or a core release moves
    # out from under us.
    - cron: '17 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        nuget restore v2rayN/v2rayN.sln

    - name: Build Solution
      run: |
        msbuild v2rayN/v2rayN.sln /p:Configuration=Release /p:Platform="Any CPU"

    # ------------------------------------------------------------------------
    # The publish output is the product. Building is not evidence that it runs:
    # a missing native, an unresolvable assembly reference or a surprise native
    # payload all produce a perfectly green build and a broken app. This step is
    # ported from the net48-port-2026.10 branch, where the same class of defect
    # was caught only after running the artifact.
    # ------------------------------------------------------------------------
    - name: Verify publish output is runnable
      shell: pwsh
      run: |
        # Locate the output rather than hardcoding it: the SDK nests it under a
        # TFM folder (bin/Release/net48/), and that has already broken this check
        # once. Asking the filesystem keeps it working if the layout changes.
        $exe = Get-ChildItem -Path 'v2rayN/v2rayN/bin' -Recurse -Filter 'v2rayN.exe' -File -ErrorAction SilentlyContinue |
               Select-Object -First 1
        if (-not $exe) {
          Write-Error "v2rayN.exe not found under v2rayN/v2rayN/bin"
          Get-ChildItem -Path 'v2rayN/v2rayN/bin' -Recurse -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          exit 1
        }
        $binDir = $exe.DirectoryName
        Write-Host "publish output: $binDir"

        $required = @(
          'v2rayN.exe',
          'Newtonsoft.Json.dll',
          'log4net.dll',
          'zxing.dll',
          'Grpc.Core.dll',
          'Google.Protobuf.dll',
          'NHotkey.dll',
          'NHotkey.WindowsForms.dll',
          'System.Memory.dll',
          # Both architectures are required. This solution is AnyCPU, so the
          # output has to carry both gRPC natives or the traffic-statistics
          # feature breaks wherever the other one is missing -- 32-bit Windows in
          # particular. grpc_csharp_ext.x86.dll is 9.5 MB of the ~25 MB output and
          # is never loaded by a 64-bit process, which makes it look removable.
          # It is not: x86 support is a requirement, so the size is the price.
          # (The sibling net48-port-2026.10 branch is x64-only and drops it.)
          'grpc_csharp_ext.x64.dll',
          'grpc_csharp_ext.x86.dll'
        )

        $forbidden = @(
        )

        $missing = $required   | Where-Object { -not (Test-Path (Join-Path $binDir $_)) }
        $present = $forbidden | Where-Object { Test-Path (Join-Path $binDir $_) }

        if ($missing) {
          Write-Error "publish output missing required runtime files: $($missing -join ', ')"
          Write-Host "Contents of ${binDir}:"
          Get-ChildItem $binDir | Select-Object -ExpandProperty Name
          exit 1
        }
        if ($present) {
          Write-Error "publish output contains files it must not (unused-arch natives): $($present -join ', ')"
          exit 1
        }

        # Assembly binding on .NET Framework.
        #
        # Without a binding redirect the loader refuses to bind a strong-named
        # assembly whose shipped version differs from the one something
        # references. NuGet ships gRPC, Protobuf and Newtonsoft.Json at versions
        # their own references do not all agree on, so this genuinely happens.
        #
        # Only *strong-named* assemblies need a redirect. Simple-name assemblies
        # (empty public key token) are bound by name alone and the version is
        # ignored -- so do not flag those, or the check cries wolf.
        function Get-AssemblyRefs([string]$path) {
            $fs = [System.IO.File]::OpenRead($path)
            try {
              $pe = [System.Reflection.PortableExecutable.PEReader]::new($fs)
              try { $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($pe) }
              catch { return $null }
              $out = @{}
              foreach ($h in $md.AssemblyReferences) {
                $r = $md.GetAssemblyReference($h)
                $out[$md.GetString($r.Name)] = $r.Version.ToString()
              }
              return $out
            }
            finally { $fs.Dispose() }
          }

        # v2rayN.exe.config carries the auto-generated redirects. MSBuild emits
        # <dependentAssembly>, not the legacy <assembly> spelling, and the
        # element sits in the asm.v1 default namespace, so parse by regex.
        $cfg = Join-Path $binDir 'v2rayN.exe.config'
        $redirects = @{}
        if (Test-Path $cfg) {
          $cfgText = Get-Content $cfg -Raw
          foreach ($blk in [regex]::Matches($cfgText, '(?s)<(?:assembly|dependentAssembly)>(.*?)</(?:assembly|dependentAssembly)>')) {
            $nm = [regex]::Match($blk.Value, 'name="([^"]+)"')
            if (-not $nm.Success) { continue }
            $redirects[$nm.Groups[1].Value] =
              @([regex]::Matches($blk.Value, 'newVersion="([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
          }
        }

        $managed = @()
        $shippedVersions = @{}
        $shippedTokens = @{}
        foreach ($dll in Get-ChildItem $binDir -Filter *.dll) {
          $refs = Get-AssemblyRefs $dll.FullName
          if ($null -eq $refs) { continue }        # native, no PE metadata
          $managed += $dll
          try {
            $an = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName)
            $shippedVersions[$dll.BaseName] = $an.Version.ToString()
            $tok = $an.GetPublicKeyToken()
            $shippedTokens[$dll.BaseName] =
              if ($null -eq $tok -or $tok.Length -eq 0) { '' } else { [System.BitConverter]::ToString($tok).Replace('-','').ToLowerInvariant() }
          }
          catch { continue }
        }

        $unresolved = @()
        foreach ($dll in $managed) {
          $refs = Get-AssemblyRefs $dll.FullName
          foreach ($name in $refs.Keys) {
            if (-not $shippedVersions.ContainsKey($name)) { continue }
            if ($refs[$name] -eq $shippedVersions[$name]) { continue }
            if ($redirects.ContainsKey($name) -and ($redirects[$name] -contains $shippedVersions[$name])) { continue }
            if ($shippedTokens[$name] -eq '') { continue }   # simple-name: version ignored
            $unresolved += "$($dll.Name) references $name $($refs[$name]) but $($shippedVersions[$name]) is shipped (strong-named), with no binding redirect"
          }
        }
        if ($unresolved) {
          $detail = ($unresolved | Select-Object -First 20) -join "`n  "
          Write-Error "output has assembly references that would fail to bind on .NET Framework:`n  $detail"
          exit 1
        }

        # Size budget. This artifact exists because it is the lightweight one;
        # a silent re-fattening is the regression this branch exists to prevent.
        # The floor is deliberately loose -- it is there to catch a new
        # multi-megabyte native appearing, not to police small changes. It sits
        # above the x86 gRPC native on purpose: that file is wanted.
        $totalMb = (Get-ChildItem $binDir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
        Write-Host ("publish output verified: {0} required files, {1} managed assemblies bind, {2:N1} MB total" -f $required.Count, $managed.Count, $totalMb)
        if ($totalMb -gt 27) {
          Write-Error ("publish output is {0:N1} MB, over the 27 MB budget. If that is intended, find out what grew before raising the budget." -f $totalMb)
          Get-ChildItem $binDir -File | Sort-Object Length -Descending | Select-Object -First 10 Name, Length
          exit 1
        }

    # Informational only. 5.39 predates per-core update management, so it names
    # core repositories as constants; some of those have moved or been deleted
    # since. A green build says nothing about them, and a dead URL only shows up
    # as a 404 when a user tries to update that core.
    - name: Check core repositories and asset names
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $globals = Get-Content v2rayN/v2rayN/Global.cs -Raw
        $repos = [regex]::Matches($globals, 'github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/releases') |
                 ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
        $headers = @{ 'User-Agent' = 'v2rayN-net48-check' }
        if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
        $bad = 0
        foreach ($r in $repos) {
          try {
            $info = Invoke-RestMethod "https://api.github.com/repos/$r" -Headers $headers
            $pushed = ([datetime]$info.pushed_at).ToString('yyyy-MM-dd')
            $flag = if ($info.archived) { 'ARCHIVED' } elseif ($pushed -lt (Get-Date).AddYears(-2).ToString('yyyy-MM-dd')) { 'STALE' } else { 'ok' }
            if ($flag -ne 'ok') { $bad++ }
            Write-Host ("  {0,-8} {1,-34} last push {2}" -f $flag, $r, $pushed)
          } catch {
            $bad++
            Write-Host ("  {0,-8} {1,-34} {2}" -f 'GONE', $r, $_.Exception.Message)
          }
        }
        if ($bad -gt 0) {
          Write-Warning "$bad of $($repos.Count) core repositories are gone, archived or stale. Updating them is a product decision, not a build fix -- see the branch README."
        }

        # Policy, enforced rather than remembered:
        #   - a core whose project is gone but that HAS a successor must not be
        #     offered; the successor is offered instead
        #   - a core whose project is gone and has NO successor is kept and offered
        #
        # Without this, "which dead cores do we keep" is a decision someone has to
        # remember, and the next person either adds a 404 back or drops something
        # with no replacement.
        $retained = @{ 'zzzgydi/mieru' = 'no successor exists; mieru is a protocol this build speaks' }
        $superseded = @{
          'Dreamacro/clash'       = 'MetaCubeX/mihomo'
          'MetaCubeX/Clash.Meta'  = 'MetaCubeX/mihomo'
        }
        # Superseded, so the successor is what gets offered -- but the old entry is
        # kept registered on purpose, because it is still downloadable and removing it
        # would break profiles that pin coreType to it. It must still not be offered
        # for new selections.
        $supersededButKept = @{
          'SagerNet/v2ray-core'   = 'v2fly/v2ray-core'
        }

        $offeredText = Get-Content v2rayN/v2rayN/Global.cs -Raw
        $offeredBlock = [regex]::Match($offeredText, 'coreTypes\s*=\s*new List<string>\s*\{(?<b>[^}]*)\}').Groups['b'].Value
        $offered = [regex]::Matches($offeredBlock, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }

        $urlText = Get-Content v2rayN/v2rayN/Global.cs -Raw
        foreach ($r in $superseded.Keys) {
          $slug = $r.Split('/')[1]
          $constants = [regex]::Matches($urlText, 'public const string \w*CoreUrl\s*=\s*"https://github\.com/' + [regex]::Escape($r))
          $inUrls = $constants.Count -gt 0
          $inOffered = $offered -contains $slug
          if ($inUrls -or $inOffered) {
            Write-Error "$r has a successor ($($superseded[$r])) and must not be offered or have a CoreUrl here (offered: $inOffered, CoreUrl: $inUrls)"
            exit 1
          }
          Write-Host ("  ok       {0,-30} superseded by {1}, not offered" -f $r, $superseded[$r])
        }
        foreach ($r in $supersededButKept.Keys) {
          $slug = $r.Split('/')[1]
          if ($offered -contains $slug) {
            Write-Error "$r has a successor ($($supersededButKept[$r])) and must not be offered for new selections"
            exit 1
          }
          Write-Host ("  ok       {0,-30} superseded by {1}, kept registered, not offered" -f $r, $supersededButKept[$r])
        }
        foreach ($r in $retained.Keys) {
          $slug = $r.Split('/')[1]
          if ($offered -notcontains $slug) {
            Write-Error "$r has no successor and must stay offered; it is not in Global.coreTypes. Reason it is kept: $($retained[$r])"
            exit 1
          }
          Write-Host ("  ok       {0,-30} kept ($($retained[$r]))" -f $r)
        }

        # A live repository says nothing about whether the asset name in a CoreInfo
        # still matches what the release publishes. clash_meta was exactly that:
        # MetaCubeX/Clash.Meta redirects to MetaCubeX/mihomo, downloads succeeded, and
        # the archive contained mihomo-windows-amd64.exe while the CoreInfo listed
        # Clash.Meta-*. So assert the Windows asset names themselves.
        $expectAssets = @{
          'juicity/juicity'            = 'juicity-windows-x86_64.zip'
          'txthinking/brook'            = 'brook_windows_amd64.exe'
          'ShadowsocksR-Live/overtls'  = 'overtls-x86_64-win7-windows-msvc.zip'
          'spongebob888/shadowquic'    = 'shadowquic-x86_64-windows.exe'
          'MetaCubeX/mihomo'           = 'mihomo-windows-amd64'
        }
        foreach ($r in $expectAssets.Keys) {
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/$r/releases/latest" -Headers $headers
            $tag = $rel.tag_name
            $found = $false
            foreach ($a in $rel.assets) {
              if ($a.name -like ($expectAssets[$r] + '*')) { $found = $true; break }
            }
            if ($found) {
              Write-Host ("  ok       {0,-30} {1} has {2} ({3})" -f $r, $tag, $expectAssets[$r], 'latest')
            } else {
              $names = ($rel.assets | Select-Object -First 8 -ExpandProperty name) -join ', '
              Write-Error "$r ($tag) does not publish an asset matching '$($expectAssets[$r])'. Its Windows assets look like: $names"
              exit 1
            }
          } catch {
            Write-Error "could not check $r assets: $($_.Exception.Message)"
            exit 1
          }
        }

    # Every core the UI offers must actually be registered, and its download
    # URLs must use the names the project actually publishes today.
    #
    # This catches a failure mode the repository-liveness check cannot: a core can
    # sit in a perfectly healthy repository and still be broken. That is exactly
    # what happened here in two ways -- "mihomo" was offered in the UI dropdown but
    # had no CoreInfo registered at all, and "clash_meta" downloaded fine (GitHub
    # redirects MetaCubeX/Clash.Meta to MetaCubeX/mihomo) while its
    # "Clash.Meta-*" exe names stopped matching "mihomo-windows-amd64.exe", so
    # the binary was never found. Both compile, both run, both fail on click.
    - name: Verify offered cores are registered
      shell: pwsh
      run: |
        $globals  = Get-Content v2rayN/v2rayN/Global.cs -Raw
        $lazy     = Get-Content v2rayN/v2rayN/Handler/LazyConfig.cs -Raw

        $offered = [regex]::Match($globals, 'coreTypes\s*=\s*new List<string>\s*\{(?<body>[^}]*)\}').Groups['body'].Value |
                  ForEach-Object { [regex]::Matches($_, '"([^"]+)"') } | ForEach-Object { $_.Groups[1].Value }
        $registered = [regex]::Matches($lazy, 'coreType\s*=\s*ECoreType\.(?<n>\w+)') | ForEach-Object { $_.Groups['n'].Value } |
                      Sort-Object -Unique

        Write-Host "offered to the UI : $($offered.Count)"
        Write-Host "registered        : $($registered.Count)"

        $errors = @()
        foreach ($c in $offered) {
          if ($registered -notcontains $c) {
            $errors += "'$c' is offered in Global.coreTypes but has no CoreInfo registration in LazyConfig"
          }
        }
        if ($errors) {
          $errors | ForEach-Object { Write-Host "  $_" }
          Write-Error "offered cores that are not registered"
          exit 1
        }

        # mihomo's exe name is the one that has to match what the repo publishes;
        # check it against the release asset we know ships.
        if ($offered -contains 'mihomo') {
          $mihomoExe = [regex]::Match($lazy, 'ECoreType\.mihomo[\s\S]{0,600}?coreExes\s*=\s*new List<string>\s*\{(?<b>[^}]*)\}')
          if (-not $mihomoExe.Success) { Write-Error "could not find the mihomo coreExes list"; exit 1 }
          if ($mihomoExe.Groups['b'].Value -notmatch 'mihomo-windows-amd64') {
            Write-Error "mihomo coreExes does not list mihomo-windows-amd64, which is the exe the current release publishes"
            exit 1
          }
          Write-Host "  mihomo exe names match the current release asset"
        }

        Write-Host "all offered cores are registered"

    # A generated config that sing-box rejects is invisible to the compiler and only
    # fails when a user's proxy silently refuses to start. This runs
    # `sing-box check` over everything the generator produces.
    - name: Verify generated sing-box configs
      shell: pwsh
      # Artifact downloads from another repository require authentication, and
      # GITHUB_TOKEN is not exposed to a step unless it is mapped explicitly here.
      # Without it the MASQUE nightly download returns 401 "Requires
      # authentication" and fails the step.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $gen = Join-Path $env:RUNNER_TEMP 'singbox-config-check'
        New-Item -ItemType Directory -Force -Path $gen | Out-Null

        # Generate the configs. Done via the real v2rayN project reference, so the
        # output comes from the same VmessItem the app populates.
        # This project is deliberately not in v2rayN.sln, so the solution-wide
        # restore above does not cover it -- NETSDK1004 otherwise.
        nuget restore v2rayN/SingboxConfigCheck/SingboxConfigCheck.csproj
        if ($LASTEXITCODE -ne 0) { throw "SingboxConfigCheck restore failed" }
        msbuild v2rayN/SingboxConfigCheck/SingboxConfigCheck.csproj `
          /p:Configuration=Release /p:Platform="Any CPU" /v:minimal /nologo
        if ($LASTEXITCODE -ne 0) { throw "SingboxConfigCheck failed to build" }
        $exe = Get-ChildItem v2rayN/SingboxConfigCheck/bin -Recurse -Filter 'SingboxConfigCheck.exe' -File |
               Select-Object -First 1
        if (-not $exe) { throw "SingboxConfigCheck.exe not found after build" }
        & $exe.FullName $gen
        if ($LASTEXITCODE -ne 0) { throw "config generation reported failures" }

        # Validate them with the real sing-box.
        $headers = @{ 'User-Agent' = 'v2rayN-net48-check' }
        if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
        $rel = Invoke-RestMethod 'https://api.github.com/repos/SagerNet/sing-box/releases/latest' -Headers $headers
        $ver = $rel.tag_name.TrimStart('v')
        $asset = $rel.assets | Where-Object { $_.name -eq "sing-box-$ver-windows-amd64.zip" } | Select-Object -First 1
        if (-not $asset) { throw "sing-box $ver windows-amd64 asset not found" }
        $zip = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
        Invoke-WebRequest $asset.browser_download_url -OutFile $zip
        Expand-Archive -Force $zip (Join-Path $env:RUNNER_TEMP 'sing-box-bin')
        $sb = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sing-box-bin') -Recurse -Filter 'sing-box.exe' -File |
             Select-Object -First 1
        if (-not $sb) { throw "sing-box.exe not found in the downloaded archive" }
        Write-Host "validating with sing-box $ver"

        # MASQUE lives in sing-box master (e22cd5406, 2026-09-21) and is still 45
        # commits ahead of v1.14.2, so the release every user installs rejects it.
        # Skip only that one file here and check it in the master-build step below,
        # rather than failing the build on a config that is correct but unreleased.
        $masque = Join-Path $gen 'masque.json'
        $skipMasque = $false
        if (Test-Path $masque) {
          Write-Host "  skip   masque.json here (no released sing-box has it); checked separately below"
          $skipMasque = $true
        }

        $bad = 0
        $count = 0
        foreach ($f in Get-ChildItem $gen -Filter *.json) {
          if ($skipMasque -and $f.FullName -eq $masque) { continue }
          $count++
          $out = & $sb.FullName check -c $f.FullName 2>&1
          if ($LASTEXITCODE -ne 0) {
            $bad++
            Write-Host "  INVALID $($f.Name)"
            $out | Select-Object -First 5 | ForEach-Object { Write-Host "      $_" }
          } else {
            Write-Host "  valid   $($f.Name)"
          }
          Remove-Item $f.FullName -Force
        }
        if ($bad -gt 0) { throw "$bad of $count generated sing-box configurations were rejected" }
        Write-Host "all $count generated sing-box configurations accepted by sing-box $ver"

        # --- Validate MASQUE against a prebuilt sing-box that has it -----------
        # MASQUE is in sing-box master (e22cd5406, 2026-09-21) and is still ahead of
        # v1.14.2, so the release every user installs rejects it. It does ship in the
        # project's own nightly builds of the testing branch -- so take the artifact
        # rather than compiling sing-box from source in CI, which took minutes.
        #
        # binary-windows_amd64-legacy-windows-7 is deliberate: it is the Win7-capable
        # build, which is the point of this branch.
        if (-not (Test-Path $masque)) {
          Write-Host "no masque.json was produced by the checker; nothing to validate"
          return
        }
        Write-Host "looking for a sing-box nightly with MASQUE"
        $headers = @{ 'User-Agent' = 'v2rayN-net48-check' }
        if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "token $env:GITHUB_TOKEN" }

        # Runs older than the MASQUE commit cannot contain it, so require that.
        # This also makes the selection deterministic: the API does not promise an
        # ordering across the pagination, and a run whose artifacts were expired or
        # unreadable was previously skipped in a way that silently walked backwards
        # to a pre-MASQUE build and then failed the step.
        $masqueCommit = [datetime]::Parse('2026-09-21T00:00:00Z').ToUniversalTime()
        $nightly = $null
        $runs = Invoke-RestMethod 'https://api.github.com/repos/SagerNet/sing-box/actions/workflows/build.yml/runs?branch=testing&per_page=20&status=success' -Headers $headers
        foreach ($r in ($runs.workflow_runs | Sort-Object created_at -Descending)) {
          if ([datetime]::Parse($r.created_at).ToUniversalTime() -lt $masqueCommit) { break }
          try {
            $arts = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/actions/runs/$($r.id)/artifacts" -Headers $headers
          } catch {
            Write-Host "  could not list artifacts for run $($r.id): $($_.Exception.Message)"
            continue
          }
          $a = $arts.artifacts | Where-Object { $_.name -eq 'binary-windows_amd64-legacy-windows-7' -and -not $_.expired } | Select-Object -First 1
          if ($a) { $nightly = [pscustomobject]@{ Run = $r; Artifact = $a }; break }
        }
        if (-not $nightly) {
          # Do not fail the build over this: the config is already covered by the
          # structural assertions above, and whether MASQUE is still in sing-box's
          # tree is sing-box's CI to decide, not this build's.
          Write-Warning "could not find a sing-box nightly with MASQUE; skipping the runtime check (shape is asserted structurally above)"
          return
        }
        Write-Host "using sing-box nightly from run $($nightly.Run.id) ($($nightly.Run.head_sha.Substring(0,9)), $($nightly.Run.created_at))"

        $zipPath = Join-Path $env:RUNNER_TEMP 'sb-nightly.zip'
        try {
          Invoke-WebRequest "https://api.github.com/repos/SagerNet/sing-box/actions/artifacts/$($nightly.Artifact.id)/zip" `
            -Headers $headers -OutFile $zipPath
        } catch {
          Write-Warning "could not download the sing-box nightly artifact: $($_.Exception.Message)"
          Write-Warning "skipping the runtime MASQUE check; its shape is asserted structurally in the suite above"
          return
        }
        Expand-Archive -Force $zipPath (Join-Path $env:RUNNER_TEMP 'sb-nightly')
        $sbNightly = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sb-nightly') -Recurse -Filter '*.zip' -File |
                     Sort-Object Length -Descending | Select-Object -First 1
        if ($sbNightly) { Expand-Archive -Force $sbNightly.FullName (Join-Path $env:RUNNER_TEMP 'sb-nightly-bin') }
        $sbExe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sb-nightly-bin') -Recurse -Filter 'sing-box.exe' -File |
                 Select-Object -First 1
        if (-not $sbExe) { Write-Warning "sing-box.exe not found in the nightly artifact; skipping the runtime MASQUE check"; return }

        $vout = & $sbExe.FullName version
        Write-Host "built: $($vout -join ' ')"
        $mout = & $sbExe.FullName check -c $masque 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Error "masque.json was rejected by the sing-box nightly:"
          $mout | Select-Object -First 10 | ForEach-Object { Write-Host "  $_" }
          exit 1
        }
        Write-Host "  valid   masque.json (accepted by a prebuilt sing-box nightly)"

    - name: Upload artifacts
