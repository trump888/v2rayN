name: build net48 (Win7/Win10 lightweight)

# =============================================================================
# Build the latest v2rayN as a .NET Framework 4.8 WPF application.
#
# Runs on windows-latest (free for public repos). Produces a framework-dependent
# zip that runs on Win7 SP1 / Win10 / Win11 (target machine must have
# .NET Framework 4.8 installed; Win10 1709+ ships with it).
#
# Triggers:
#   - push to master       : build + upload artifact (no release)
#   - workflow_dispatch    : manual trigger; if `release_tag` is provided,
#                            also creates a GitHub Release with the zip
#   - schedule             : nightly build at 02:00 UTC to catch upstream
# =============================================================================

on:
  push:
    branches: [ master ]
    paths:
      - 'v2rayN/**'
      - '.github/workflows/build-net48.yml'
      - 'net48-patches/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish as (e.g. 7.25.4-net48). Leave empty for build-only.'
        required: false
        type: string
      use_release_source:
        description: 'Check out a stable release tag instead of HEAD (recommended)'
        required: false
        type: boolean
        default: true
      release_version:
        description: 'Pin a specific upstream tag. Leave empty to use the latest release.'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: build net48 x64
    runs-on: windows-latest

    steps:
      - name: Configure git (longpaths)
        run: git config --global core.longpaths true

      # =====================================================================
      # Two-step checkout:
      #   1. Checkout fork HEAD to get net48-patches/ and .github/workflows/
      #   2. Checkout the upstream source (release tag or master) into
      #      v2rayN-src, then move its v2rayN/ folder into place.
      #
      # The port tracks the same package versions as upstream (ReactiveUI 24.x
      # via its net481 asset, MaterialDesignThemes 5.3.2 via net462, ...), so new
      # upstream releases normally need no port changes at all. Only Downloader
      # stays pinned older, because 3.2.0+ dropped every net48-consumable asset.
      # =====================================================================

      - name: Checkout fork HEAD (for net48-patches/)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: fork-head

      - name: Resolve upstream ref
        id: upstream
        shell: pwsh
        run: |
          $useRelease = '${{ inputs.use_release_source }}' -ne 'false'
          $pinned = '${{ inputs.release_version }}'

          if (-not $useRelease) {
            $ref = 'master'
            Write-Host "Building from upstream master (bleeding edge)"
          }
          elseif ($pinned) {
            $ref = $pinned
            Write-Host "Building from pinned upstream tag $ref"
          }
          else {
            # No pin: take the newest published release, so upstream bug fixes
            # and features are picked up without editing this workflow.
            $latest = Invoke-RestMethod 'https://api.github.com/repos/2dust/v2rayN/releases/latest'
            $ref = $latest.tag_name
            Write-Host "Resolved latest upstream release: $ref"
          }

          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          repository: 2dust/v2rayN
          ref: ${{ steps.upstream.outputs.ref }}
          path: v2rayN-src

      - name: Move patches into place
        shell: pwsh
        run: |
          # Replace v2rayN-src/v2rayN/ with the upstream source, then move
          # fork-head's net48-patches/ next to it.
          mv v2rayN-src/v2rayN ./v2rayN
          mv fork-head/net48-patches ./net48-patches
          # Show structure
          ls
          ls v2rayN | Select-Object -First 5
          ls net48-patches

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK 9 (for C# 13 / partial properties support)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Add .NET Framework 4.8 Developer Pack check
        shell: pwsh
        run: |
          # windows-latest already has .NET Framework 4.8 SDK + Developer Pack
          # Verify reference assemblies are present
          $refPath = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          if (-not (Test-Path $refPath)) {
            Write-Error "NET Framework 4.8 reference assemblies not found at $refPath"
            exit 1
          }
          Write-Host "✓ NET Framework 4.8 reference assemblies available"
          Get-ChildItem "$refPath\*.dll" | Measure-Object | ForEach-Object {
            Write-Host "  Reference assemblies count: $($_.Count)"
          }

      - name: Apply net48 patches
        shell: pwsh
        run: |
          Write-Host "=== Applying net48 port patches ==="
          & ./net48-patches/scripts/apply-patches.ps1 -SourceDir ./v2rayN
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Patch application failed"
            exit 1
          }

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: ./v2rayN
        run: |
          # ServiceLib.UdpTest ProjectReference has Condition="'$(BuildNet48)' == 'true'"
          # which evaluates to false by default, so UdpTest is skipped automatically.
          # No need to pass any extra flags.
          dotnet restore v2rayN.sln
          if ($LASTEXITCODE -ne 0) {
            Write-Host "dotnet restore failed, trying msbuild -t:Restore"
            msbuild v2rayN.sln -t:Restore -p:Configuration=Release
          }

      - name: Build Solution (Release, x64)
        shell: pwsh
        working-directory: ./v2rayN
        run: |
          Write-Host "=== Building v2rayN-net48 (Release) ==="
          # -m:1 disables parallel build to avoid .resources file lock contention
          # between ServiceLib and ServiceLib.Tests (both write to obj/Release/net48/)
          msbuild v2rayN.sln `
            -p:Configuration=Release `
            -p:Platform="Any CPU" `
            -p:TargetFramework=net48 `
            -m:1 `
            -v:minimal `
            -nologo `
            -clp:Summary

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed"
            exit 1
          }

      # =====================================================================
      # Runtime-asset gate.
      #
      # This build compiles without RuntimeIdentifier too, so a missing RID -
      # or a package that stops shipping natives - produces a clean compile and
      # an app that dies before showing a window. Repobot.SQLite.Unofficial
      # ships no buildTransitive targets, so without a RuntimeIdentifier the
      # SDK never copies its runtimes/win-x64/native/e_sqlite3.dll into the
      # output. SqliteHelper's constructor then throws DllNotFoundException on
      # the first CreateTable call, which App.OnStartup makes before
      # Show(); App.xaml.cs swallows DispatcherUnhandledException and
      # ShutdownMode is OnExplicitShutdown, so the only symptom is a running
      # process with no window and no error dialog.
      #
      # Assert the publish output is actually runnable here instead.
      # =====================================================================
      - name: Verify publish output is runnable
        shell: pwsh
        run: |
          $binDir = "./v2rayN/v2rayN/bin/Release/net48"
          if (-not (Test-Path $binDir)) { Write-Error "build output not found: $binDir"; exit 1 }

          $required = @(
            'v2rayN.exe',
            'ServiceLib.dll',
            'ReactiveUI.dll',
            'ReactiveUI.Wpf.dll',
            'ReactiveUI.Primitives.dll',
            'MaterialDesignThemes.Wpf.dll',
            'SQLitePCLRaw.core.dll',
            'SQLitePCLRaw.provider.e_sqlite3.dll',
            'e_sqlite3.dll',
            'System.Text.Json.dll',
            'System.Memory.dll'
          )

          # NuGet emits FodyWeavers / Fody output for the old ReactiveUI.Fody
          # package; its presence means the port regressed to ReactiveUI 19.x.
          $forbidden = @('FodyWeavers.exe', 'ReactiveUI.Fody.dll')

          $missing = $required   | Where-Object { -not (Test-Path (Join-Path $binDir $_)) }
          $present = $forbidden | Where-Object { Test-Path (Join-Path $binDir $_) }

          if ($missing) {
            Write-Error "publish output missing required runtime files: $($missing -join ', ')"
            Write-Host "Contents of $binDir :"
            Get-ChildItem $binDir | Select-Object -ExpandProperty Name
            exit 1
          }
          if ($present) {
            Write-Error "publish output contains removed ReactiveUI.Fody artifacts: $($present -join ', ')"
            exit 1
          }

          # Binding redirects on .NET Framework.
          #
          # System.Memory and System.Buffers genuinely need them: older
          # MaterialDesignThemes/ReactiveUI builds reference 4.0.1.x while the
          # port ships 4.0.5.0, and AutoGenerateBindingRedirects emits a redirect
          # for that difference.
          #
          # System.Text.Json does NOT need one, and demanding it was a false
          # alarm. The shipped System.Text.Json.dll (package 10.0.12) has
          # assembly identity 10.0.0.12, which is exactly the version
          # ServiceLib.dll references, so .NET Framework resolves it with no
          # redirect. AutoGenerateBindingRedirects only emits a redirect when a
          # referenced version differs from the shipped one, so a matching
          # version correctly produces none.
          #
          # Instead of hardcoding a list of names that "should" have a redirect,
          # assert the invariant that actually decides loadability: for every
          # assembly reference in the output that resolves to a file we also
          # ship, the referenced version must match the shipped version, or
          # v2rayN.exe.config must carry a binding redirect for it pointing at
          # the shipped version. That covers System.Text.Json today and any
          # future package bump, instead of trusting three hardcoded strings.
          $cfg = Join-Path $binDir 'v2rayN.exe.config'
          if (-not (Test-Path $cfg)) {
            Write-Error "v2rayN.exe.config is missing (no binding redirects on .NET Framework)"
            exit 1
          }
          $cfgText = Get-Content $cfg -Raw
          foreach ($asm in @('System.Memory', 'System.Buffers')) {
            if ($cfgText -notmatch [regex]::Escape($asm)) {
              Write-Error "v2rayN.exe.config has no binding redirect for $asm"
              exit 1
            }
          }

          function Get-AssemblyRefs([string]$path) {
            $fs = [System.IO.File]::OpenRead($path)
            try {
              $pe = [System.Reflection.PortableExecutable.PEReader]::new($fs)
              try { $md = [System.Reflection.Metadata.PEReaderExtensions]::GetMetadataReader($pe) }
              catch { return $null }   # native DLL (e_sqlite3.dll, libSkiaSharp.dll, ...)
              $out = @{}
              foreach ($h in $md.AssemblyReferences) {
                $r = $md.GetAssemblyReference($h)
                $out[$md.GetString($r.Name)] = $r.Version.ToString()
              }
              return $out
            }
            finally { $fs.Dispose() }
          }

          # assemblyName -> the newVersions v2rayN.exe.config redirects it to.
          # MSBuild's auto-generation emits <dependentAssembly> (one
          # <assemblyBinding> element per assembly), not the legacy <assembly>
          # spelling, so match both. Parsed by regex over the raw text on
          # purpose: <assemblyBinding> carries the
          # urn:schemas-microsoft-com:asm.v1 default namespace and walking that
          # through PowerShell's XML adapter silently yields nothing.
          $redirects = @{}
          foreach ($blk in [regex]::Matches($cfgText, '(?s)<(?:assembly|dependentAssembly)>(.*?)</(?:assembly|dependentAssembly)>')) {
            $nm = [regex]::Match($blk.Value, 'name="([^"]+)"')
            if (-not $nm.Success) { continue }
            $redirects[$nm.Groups[1].Value] =
              @([regex]::Matches($blk.Value, 'newVersion="([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
          }

          $managed = @()
          $shippedVersions = @{}
          $shippedTokens = @{}
          foreach ($dll in Get-ChildItem $binDir -Filter *.dll) {
            $refs = Get-AssemblyRefs $dll.FullName
            if ($null -eq $refs) { continue }          # not a managed assembly
            $managed += $dll
            try {
              $an = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName)
              $shippedVersions[$dll.BaseName] = $an.Version.ToString()
              $tok = $an.GetPublicKeyToken()
              $shippedTokens[$dll.BaseName] =
                if ($null -eq $tok -or $tok.Length -eq 0) { '' } else { [System.BitConverter]::ToString($tok).Replace('-','').ToLowerInvariant() }
            }
            catch { continue }
          }

          $unresolved = @()
          foreach ($dll in $managed) {
            $refs = Get-AssemblyRefs $dll.FullName
            foreach ($name in $refs.Keys) {
              if (-not $shippedVersions.ContainsKey($name)) { continue }
              if ($refs[$name] -eq $shippedVersions[$name]) { continue }
              # A redirect pointing at the shipped version resolves the difference.
              if ($redirects.ContainsKey($name) -and ($redirects[$name] -contains $shippedVersions[$name])) { continue }
              # Only strong-named assemblies actually need one. The loader binds
              # simple-name assemblies by name alone and ignores the version, so
              # the ReactiveUI 7.0.0.0 -> 8.0.0.0 skew (those assemblies ship with
              # an empty public key token) binds fine and must not be flagged.
              if ($shippedTokens[$name] -eq '') { continue }
              $unresolved += "$($dll.Name) references $name $($refs[$name]) but $($shippedVersions[$name]) is shipped (strong-named), with no binding redirect"
            }
          }
          if ($unresolved) {
            # Emit config + report as one error: a bare Write-Error followed by
            # separate output loses the detail, because Write-Error terminates
            # the step before the rest runs.
            $detail = ($unresolved | Select-Object -First 20) -join "`n  "
            Write-Error "output has assembly references that would fail to bind on .NET Framework:`n  $detail`n`n----- v2rayN.exe.config -----`n$cfgText"
            exit 1
          }

          Write-Host "publish output verified: $($required.Count) required files present, $($managed.Count) managed assemblies bind, redirects OK"

      - name: Collect build outputs
        shell: pwsh
        run: |
          $out = "publish-net48"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Main exe + dlls
          $binDir = "./v2rayN/v2rayN/bin/Release/net48"
          if (Test-Path $binDir) {
            Copy-Item "$binDir/*" $out -Recurse -Force
          } else {
            Write-Error "Build output not found: $binDir"
            exit 1
          }

          # AmazTool (upgrade helper)
          $amazBin = "./v2rayN/AmazTool/bin/Release/net48"
          if (Test-Path $amazBin) {
            Copy-Item "$amazBin/AmazTool.exe" $out -Force
          }

          # Sample / Resources (if not embedded)
          # (already embedded as EmbeddedResource in ServiceLib.dll)

          Get-ChildItem $out | Format-Table Name, Length -AutoSize
          Write-Host "Total size: $((Get-ChildItem $out -Recurse | Measure-Object Length -Sum).Sum / 1MB) MB"

      - name: Download xray/sing-box cores (optional)
        shell: pwsh
        run: |
          # Download cores matching the upstream v2rayN-core-bin repository
          # so the produced zip is immediately usable.
          $bin = "publish-net48/bin"
          New-Item -ItemType Directory -Force -Path $bin/xray, $bin/sing_box | Out-Null

          $ProgressPreference = "SilentlyContinue"

          # Xray-core latest stable
          $xrayLatest = (Invoke-RestMethod "https://api.github.com/repos/XTLS/Xray-core/releases/latest").tag_name
          $xrayVer = $xrayLatest.TrimStart('v')
          Write-Host "Downloading Xray-core $xrayVer..."
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/v$xrayVer/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive -Force xray.zip xray-extracted
          Copy-Item xray-extracted/xray.exe "$bin/xray/" -Force
          Copy-Item xray-extracted/geoip.dat "$bin/xray/" -Force
          Copy-Item xray-extracted/geosite.dat "$bin/xray/" -Force

          # sing-box latest stable
          $singLatest = (Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/latest").tag_name
          $singVer = $singLatest.TrimStart('v')
          Write-Host "Downloading sing-box $singVer..."
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$singVer/sing-box-$singVer-windows-amd64.zip" -OutFile singbox.zip
          Expand-Archive -Force singbox.zip singbox-extracted
          $singExe = Get-ChildItem singbox-extracted -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          Copy-Item $singExe.FullName "$bin/sing_box/" -Force
          $cronet = Get-ChildItem singbox-extracted -Recurse -Filter "libcronet*.dll" | Select-Object -First 1
          if ($cronet) { Copy-Item $cronet.FullName "$bin/sing_box/libcronet.dll" -Force }

          # GeoSite / GeoIP for sing-box SRS rules
          New-Item -ItemType Directory -Force -Path "$bin/srss" | Out-Null
          $srss = @(
            "geoip-cn.srs", "geoip-private.srs",
            "geosite-cn.srs", "geosite-gfw.srs", "geosite-google.srs",
            "geosite-private.srs", "geosite-category-ads-all.srs"
          )
          foreach ($s in $srss) {
            try {
              Invoke-WebRequest "https://raw.githubusercontent.com/2dust/sing-box-rules/refs/heads/rule-set-geoip/$s" -OutFile "$bin/srss/$s" -ErrorAction Stop
            } catch {
              try {
                Invoke-WebRequest "https://raw.githubusercontent.com/2dust/sing-box-rules/refs/heads/rule-set-geosite/$s" -OutFile "$bin/srss/$s"
              } catch { Write-Host "  $s not found (skipped)" }
            }
          }

      - name: Create startup batch file
        shell: pwsh
        run: |
          # Make it easy for users: double-click v2rayN-net48.bat to launch.
          # Ensures .NET Framework 4.8 is installed.
          @'
          @echo off
          REM v2rayN .NET Framework 4.8 launcher
          REM Requires: Windows 7 SP1 / Windows 10 / Windows 11 with .NET Framework 4.8

          reg query "HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" /v Release 2>nul | findstr "528040" >nul
          if errorlevel 1 (
              echo .NET Framework 4.8 is not installed.
              echo Download from: https://dotnet.microsoft.com/download/dotnet-framework/net48
              pause
              exit /b 1
          )

          start "" "%~dp0v2rayN.exe"
          '@ | Out-File -FilePath publish-net48/v2rayN-net48.bat -Encoding ASCII

      - name: Zip artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.upstream.outputs.version }}"
          if ($ver -eq "") { $ver = "master" }
          $zipName = "v2rayN-windows-net48-x64.zip"
          Compress-Archive -Path "publish-net48/*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName ($((Get-Item $zipName).Length / 1MB) MB)"

          # Save version info
          "Build: $ver" | Out-File -FilePath build-info.txt
          "Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" | Out-File -FilePath build-info.txt -Append
          "Commit: ${{ github.sha }}" | Out-File -FilePath build-info.txt -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-windows-net48-x64
          path: |
            v2rayN-windows-net48-x64.zip
            build-info.txt
          retention-days: 30
          compression-level: 0   # already zipped

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          Write-Host "Creating release $tag"

          $notes = @"
          # v2rayN $tag (.NET Framework 4.8 port)

          Built from upstream ${{ steps.upstream.outputs.version }}.

          ## System Requirements

          - Windows 7 SP1 / Windows 10 / Windows 11 (x64)
          - .NET Framework 4.8 ([download](https://dotnet.microsoft.com/download/dotnet-framework/net48))

          ## Install

          1. Extract the zip to a folder (e.g. ``C:\v2rayN``)
          2. Double-click ``v2rayN-net48.bat`` (or ``v2rayN.exe`` directly)
          3. Cores (xray + sing-box) are bundled in ``bin\``

          ## Differences from upstream release

          - Target framework: ``net48`` instead of ``net10.0-windows``
          - Self-contained: NO (requires .NET Framework 4.8 on target machine)
          - Single-file: NO (folder with multiple DLLs)
          - UDP test feature: stubbed out (returns -1)
          - Tar extraction: uses ``tar.exe`` (present on Win10 1709+ / Win11)
          - CertificateChainPolicy: ignored (uses system trust store)

          See ``build-info.txt`` for full build metadata.
          "@

          gh release create $tag `
            v2rayN-windows-net48-x64.zip `
            build-info.txt `
            --title "v2rayN $tag (net48 port)" `
            --notes $notes `
            --prerelease
