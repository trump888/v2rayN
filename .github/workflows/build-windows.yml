name: release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - mod-latest

env:
  OutputArch: "windows-64"
  OutputPath:  "${{ github.workspace }}/v2rayN/Release"

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: 'recursive'

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: |
        nuget restore v2rayN/v2rayN.sln

    - name: Build v2rayN
      run: |
        dotnet build v2rayN/v2rayN/v2rayN.csproj -c Release -o "${{ env.OutputPath }}/v2rayN"

    - name: Build AmazTool
      run: |
        dotnet build v2rayN/AmazTool/AmazTool.csproj -c Release -o "${{ env.OutputPath }}/AmazTool"
   
    - name: Upload build artifacts
      uses: actions/upload-artifact@v6.0.0
      with:
        name: v2rayN-windows
        path: |
          ${{ env.OutputPath }}/**
    
    # release zip archive
    - name: Package release zip archive
      if: github.event.inputs.release_tag != ''
      run: |
        cd v2rayN
        mkdir -p Release
        cp -r "${{ env.OutputPath }}"/* Release/
        powershell -Command "Compress-Archive -Path 'Release/*' -DestinationPath 'v2rayN-windows.zip' -Force"
    
    - name: Upload zip archive to release
      uses: svenstaro/upload-release-action@v2
      if: github.event.inputs.release_tag != ''
      with:
        file: v2rayN/v2rayN-windows.zip
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
        prerelease: true
